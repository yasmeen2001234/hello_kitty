<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Piano</title>
    <link rel="stylesheet" href="/styles/piano.css" />
    <link rel="stylesheet" href="/styles/rainbow.css" />
    <link rel="stylesheet" href="/styles/jackBox.css" />
  </head>
  <body>
    <!-- ── Loading overlay (unchanged) ── -->
    <div
      id="loading-overlay"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #ee9ca7;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
      "
    >
      <div
        id="rainbow-stage"
        style="
          width: 100vw;
          height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
        "
      >
        <canvas id="rainbow" style="width: 100%; height: 100%"></canvas>
        <img
          id="slide-overlay"
          src="Images/Animation/slide.png"
          alt="Sliding character"
        />
        <img
          id="slide-overlay-boy"
          src="Images/Animation/slide_boy.png"
          alt="Sliding boy"
        />
      </div>
    </div>

    <!-- ── Piano content ── -->
    <div id="piano-content" style="display: none">
      <!-- ══ JACK-IN-THE-BOX ══ -->
      <div id="jack-hint">🎵 Play 4 keys to crank the box!</div>
      <div id="jack-container">
        <div id="surprise-text"></div>
        <div id="love-banner">
          <div class="love-text">
            <p class="love-title">I LOVE YOU</p>
            <p>You make</p>
            <p>my heart sing!</p>
          </div>
        </div>

        <svg
          id="jack-svg"
          viewBox="60 -70 100 500"
          width="500"
          height="500"
          xmlns="http://www.w3.org/2000/svg"
        >
          <!-- ── LID ── -->
          <g id="box-lid">
            <rect
              x="25"
              y="97"
              width="130"
              height="20"
              rx="5"
              fill="#e55b8a"
              stroke="#b03060"
              stroke-width="2.5"
            />
            <!-- lid top flap -->
            <rect
              x="30"
              y="75"
              width="120"
              height="28"
              rx="5"
              fill="#f472a8"
              stroke="#b03060"
              stroke-width="2.5"
            />
            <rect
              x="35"
              y="78"
              width="40"
              height="22"
              rx="4"
              fill="#f9a8d4"
              opacity="0.35"
            />
          </g>

          <!-- ── POP IMAGE (hidden until pop) ── -->
          <image
            id="clown-group"
            href="Images/Animation/happy.png"
            x="20"
            y="15"
            width="150"
            height="150"
            preserveAspectRatio="xMidYMid meet"
          />

          <!-- ── BOX BODY ── -->
          <rect
            x="30"
            y="110"
            width="120"
            height="100"
            rx="8"
            fill="#5bc8f5"
            stroke="#3a8dbf"
            stroke-width="3"
          />
          <!-- box shine -->
          <rect
            x="35"
            y="115"
            width="50"
            height="90"
            rx="6"
            fill="#7ed9fa"
            opacity="0.3"
          />
          <!-- star decorations -->
          <text
            x="55"
            y="175"
            font-size="28"
            text-anchor="middle"
            fill="#ffd700"
            opacity="0.9"
          >
            ★
          </text>
          <text
            x="125"
            y="175"
            font-size="28"
            text-anchor="middle"
            fill="#ffd700"
            opacity="0.9"
          >
            ★
          </text>
          <!-- pink bow -->
          <ellipse
            cx="90"
            cy="210"
            rx="28"
            ry="10"
            fill="#f9a8d4"
            stroke="#e879a0"
            stroke-width="2"
          />
          <ellipse
            cx="63"
            cy="207"
            rx="14"
            ry="9"
            fill="#f9a8d4"
            stroke="#e879a0"
            stroke-width="2"
            transform="rotate(-20,63,207)"
          />
          <ellipse
            cx="117"
            cy="207"
            rx="14"
            ry="9"
            fill="#f9a8d4"
            stroke="#e879a0"
            stroke-width="2"
            transform="rotate(20,117,207)"
          />
          <circle
            cx="90"
            cy="210"
            r="5"
            fill="#fb7eb8"
            stroke="#e879a0"
            stroke-width="1.5"
          />
          <!-- ribbon cross -->
          <line
            x1="90"
            y1="110"
            x2="90"
            y2="210"
            stroke="#fde68a"
            stroke-width="3.5"
            opacity="0.7"
          />
          <line
            x1="30"
            y1="160"
            x2="150"
            y2="160"
            stroke="#fde68a"
            stroke-width="3.5"
            opacity="0.7"
          />

          <!-- ── CRANK ── -->
          <g id="crank-group">
            <!-- crank axle -->
            <circle
              cx="158"
              cy="148"
              r="7"
              fill="#d97706"
              stroke="#92400e"
              stroke-width="2"
            />
            <!-- crank arm -->
            <rect
              x="155"
              y="126"
              width="6"
              height="25"
              rx="3"
              fill="#d97706"
              stroke="#92400e"
              stroke-width="1.5"
            />
            <!-- crank handle ball -->
            <circle
              cx="158"
              cy="124"
              r="8"
              fill="#f59e0b"
              stroke="#92400e"
              stroke-width="2"
            />
            <circle cx="156" cy="122" r="3" fill="#fde68a" opacity="0.6" />
          </g>
        </svg>

        <!-- confetti layer -->
        <div id="confetti-layer"></div>
      </div>
      <!-- ══ END JACK-IN-THE-BOX ══ -->

      <div class="piano-container">
        <div class="piano-stage">
          <img
            id="boy1"
            src="Images/Animation/walk1.png"
            alt="Walking character"
          />
          <div class="keyboard">
            <div class="key white" onclick="playNote(261.63)"></div>
            <div class="key white" onclick="playNote(293.66)"></div>
            <div class="key white" onclick="playNote(329.63)"></div>
            <div class="key white" onclick="playNote(349.23)"></div>
            <div class="key white" onclick="playNote(392.0)"></div>
            <div class="key white" onclick="playNote(440.0)"></div>
            <div id="b1" class="key black" onclick="playNote(277.18)"></div>
            <div id="b2" class="key black" onclick="playNote(311.13)"></div>
            <div id="b3" class="key black" onclick="playNote(369.99)"></div>
            <div id="b4" class="key black" onclick="playNote(415.3)"></div>
          </div>
        </div>
      </div>

      <div class="controls" style="display: none">
        <div class="control-group">
          <label>Instrument</label>
          <select id="soundType">
            <option value="sine">Soft Flute</option>
            <option value="triangle">Toy Piano</option>
            <option value="square">8-Bit Retro</option>
            <option value="sawtooth">Power Synth</option>
          </select>
        </div>
        <div class="control-group">
          <label>Decay (Fade Length)</label>
          <input
            type="range"
            id="decayTime"
            min="0.1"
            max="3.0"
            step="0.1"
            value="1.2"
          />
        </div>
      </div>
    </div>

    <script src="/javascript/rainbow.js"></script>

    <script>
      /* ════════════════════════════════════════
       JACK-IN-THE-BOX LOGIC
    ════════════════════════════════════════ */
      const KEYS_TO_POP = 4;
      let keyPressCount = 0;
      let hasPopped = false;
      let crankAngle = 0;

      const crankGroup = document.getElementById("crank-group");
      const boxLid = document.getElementById("box-lid");
      const clownGroup = document.getElementById("clown-group");
      const loveBanner = document.getElementById("love-banner");
      const surpriseText = document.getElementById("surprise-text");
      const jackHint = document.getElementById("jack-hint");
      const confettiLayer = document.getElementById("confetti-layer");

      const hints = [
        "🎵 Play 4 keys to crank the box!",
        "🔄 Keep going… 3 more!",
        "🔄 2 more turns…",
        "🔄 Almost there — 1 more!",
        "💥 BOOM! The clown is out!",
      ];

      const confettiColors = [
        "#ff4da6",
        "#ffd700",
        "#5bc8f5",
        "#a78bfa",
        "#34d399",
        "#fb923c",
        "#f472b6",
      ];

      function rotateCrank() {
        crankAngle += 90;
        crankGroup.style.transform = `rotate(${crankAngle}deg)`;
        // tiny extra wiggle via quick class toggle
        crankGroup.style.transition =
          "transform 0.28s cubic-bezier(.36,1.6,.6,1)";
      }

      function liftLid() {
        boxLid.style.transform = "translate(-50px, 20px) rotate(-115deg)";
      }

      function popClown() {
        clownGroup.style.opacity = "1";
        clownGroup.style.transform = "translateY(-95px) scale(1)";
        clownGroup.classList.add("clown-bouncing");
      }

      function showSurpriseText() {
        surpriseText.style.transform = "translateX(-50%) scale(1.15)";
      }

      function showLoveBanner() {
        loveBanner.classList.remove("banner-show");
        void loveBanner.offsetWidth;
        loveBanner.classList.add("banner-show");
      }

      function spawnConfetti() {
        confettiLayer.innerHTML = "";
        for (let i = 0; i < 28; i++) {
          const dot = document.createElement("div");
          dot.className = "confetti-dot";
          const color = confettiColors[i % confettiColors.length];
          dot.style.background = color;
          dot.style.left = 50 + (Math.random() - 0.5) * 80 + "px";
          dot.style.top = 80 + Math.random() * 40 + "px";
          dot.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
          dot.style.width = 6 + Math.random() * 8 + "px";
          dot.style.height = 6 + Math.random() * 8 + "px";
          const tx = (Math.random() - 0.5) * 200 + "px";
          const ty = -(50 + Math.random() * 150) + "px";
          const rot = (Math.random() - 0.5) * 720 + "deg";
          dot.style.setProperty("--tx", tx);
          dot.style.setProperty("--ty", ty);
          dot.style.setProperty("--rot", rot);
          dot.style.animation = `confettiFly ${0.6 + Math.random() * 0.8}s ease-out forwards`;
          dot.style.animationDelay = Math.random() * 0.3 + "s";
          confettiLayer.appendChild(dot);
        }
      }

      function playBoxSound() {
        // little "boing" using AudioContext
        if (!window._jackAudio) {
          window._jackAudio = new (
            window.AudioContext || window.webkitAudioContext
          )();
        }
        const ctx = window._jackAudio;
        if (ctx.state === "suspended") ctx.resume();

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(600, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.35, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.4);
      }

      function playBoingSound() {
        if (!window._jackAudio) {
          window._jackAudio = new (
            window.AudioContext || window.webkitAudioContext
          )();
        }
        const ctx = window._jackAudio;
        if (ctx.state === "suspended") ctx.resume();
        // comedy slide whistle up
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(200, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.5);
        gain.gain.setValueAtTime(0.4, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.6);
      }

      function resetJack() {
        // allow replay after 4 s
        setTimeout(() => {
          hasPopped = false;
          keyPressCount = 0;
          crankAngle = 0;
          crankGroup.style.transform = "rotate(0deg)";
          boxLid.style.transform = "";
          clownGroup.style.opacity = "0";
          clownGroup.style.transform = "";
          clownGroup.classList.remove("clown-bouncing");
          loveBanner.classList.remove("banner-show");
          surpriseText.style.transform = "translateX(-50%) scale(0)";
          jackHint.textContent = hints[0];
          jackHint.style.display = "";
          jackHint.style.opacity = "1";
        }, 4000);
      }

      function onKeyPress() {
        if (hasPopped) return;

        keyPressCount++;
        const idx = Math.min(keyPressCount, hints.length - 1);
        jackHint.textContent = hints[idx];

        rotateCrank();
        playBoxSound();

        // give a little shake to box when getting close
        if (keyPressCount === KEYS_TO_POP - 1) {
          document
            .getElementById("jack-container")
            .animate(
              [
                { transform: "translateX(0)" },
                { transform: "translateX(-5px)" },
                { transform: "translateX(5px)" },
                { transform: "translateX(-3px)" },
                { transform: "translateX(0)" },
              ],
              { duration: 350, easing: "ease-out" },
            );
        }

        if (keyPressCount >= KEYS_TO_POP) {
          hasPopped = true;
          setTimeout(() => {
            liftLid();
            playBoingSound();
            setTimeout(() => {
              popClown();
              setTimeout(showLoveBanner, 140);
              showSurpriseText();
              spawnConfetti();
              jackHint.textContent = "🤡 Click any key to do it again!";
              //  resetJack();
            }, 250);
          }, 200);
        }
      }

      /* ════════════════════════════════════════
       PIANO LOGIC (original, unchanged)
    ════════════════════════════════════════ */
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const stage = document.querySelector(".piano-stage");
      const keyboard = document.querySelector(".keyboard");
      const boy = document.getElementById("boy1");
      let currentBoyX = 0;
      let currentBoyY = 0;
      let facing = 1;
      let currentKey = null;

      function getBoyTransform(x, y = 0, direction = facing) {
        return `translate(${x}px, ${y}px) scaleX(${direction})`;
      }
      function getKeyX(key) {
        const keyboardRect = keyboard.getBoundingClientRect();
        const keyRect = key.getBoundingClientRect();
        return (
          keyRect.left -
          keyboardRect.left +
          keyRect.width / 2 -
          boy.offsetWidth / 2
        );
      }
      function getKeyY(key) {
        const stageRect = stage.getBoundingClientRect();
        const keyRect = key.getBoundingClientRect();
        const keyTopFromStageBottom = stageRect.bottom - keyRect.top;
        const footOffset = key.classList.contains("black") ? 100 : 180;
        return -keyTopFromStageBottom + footOffset;
      }
      function placeBoyOnKey(key) {
        currentBoyX = getKeyX(key);
        currentBoyY = getKeyY(key);
        boy.style.transform = getBoyTransform(currentBoyX, currentBoyY);
        currentKey = key;
      }
      function jumpBoyToKey(key) {
        const targetX = getKeyX(key);
        const targetY = getKeyY(key);
        const peakX = (currentBoyX + targetX) / 2;
        const jumpHeight = 58;
        const peakY = Math.min(currentBoyY, targetY) - jumpHeight;
        const jumpDuration = 320;
        const direction =
          targetX > currentBoyX ? 1 : targetX < currentBoyX ? -1 : facing;
        facing = direction;
        boy.classList.add("jumping");
        boy.animate(
          [
            { transform: getBoyTransform(currentBoyX, currentBoyY, direction) },
            { transform: getBoyTransform(peakX, peakY, direction) },
            { transform: getBoyTransform(targetX, targetY, direction) },
          ],
          { duration: jumpDuration, easing: "ease-out" },
        );
        currentBoyX = targetX;
        currentBoyY = targetY;
        boy.style.transform = getBoyTransform(
          currentBoyX,
          currentBoyY,
          direction,
        );
        currentKey = key;
        setTimeout(() => {
          boy.classList.remove("jumping");
        }, jumpDuration);
      }
      function initBoyPosition() {
        const firstKey = document.querySelector(".key.white");
        if (!currentKey && firstKey) {
          placeBoyOnKey(firstKey);
          return;
        }
        if (currentKey) {
          placeBoyOnKey(currentKey);
        }
      }

      // Wire all keys to BOTH jumpBoy and onKeyPress
      document.querySelectorAll(".key").forEach((key) => {
        key.addEventListener("click", () => {
          jumpBoyToKey(key);
          onKeyPress();
        });
      });
      window.addEventListener("resize", initBoyPosition);

      function showPianoAfterRainbow() {
        const overlay = document.getElementById("loading-overlay");
        const pianoContent = document.getElementById("piano-content");
        if (overlay) overlay.style.display = "none";
        if (pianoContent) pianoContent.style.display = "";
        requestAnimationFrame(initBoyPosition);
      }
      document.addEventListener("DOMContentLoaded", () => {
        if (window.__rainbowDone) {
          showPianoAfterRainbow();
          return;
        }
        window.addEventListener("rainbow:complete", showPianoAfterRainbow, {
          once: true,
        });
      });

      function playNote(freq) {
        if (audioCtx.state === "suspended") audioCtx.resume();
        const selectedSound = document.getElementById("soundType").value;
        const decayValue = parseFloat(
          document.getElementById("decayTime").value,
        );
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = selectedSound;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        const volume =
          selectedSound === "square" || selectedSound === "sawtooth"
            ? 0.1
            : 0.4;
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(volume, audioCtx.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(
          0.0001,
          audioCtx.currentTime + decayValue,
        );
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + decayValue);
      }
    </script>
  </body>
</html>
